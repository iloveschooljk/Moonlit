<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Moonlite</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --glow: rgba(255,255,255,0.08);
    --glow-strong: rgba(255,255,255,0.18);
    --glow-btn: rgba(255,255,255,0.12);
    --white: #ffffff;
    --muted: rgba(255,255,255,0.45);
    --border: rgba(255,255,255,0.12);
    --accent: #fff;
  }

  body {
    background: #000;
    color: #fff;
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    scroll-behavior: smooth;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 500px;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Navbar */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    height: 64px;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(16px);
    border-bottom: 0.5px solid var(--border);
  }

  .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .logo-icon { position: relative; width: 36px; height: 36px; flex-shrink: 0; }
  .nav-links { display: flex; align-items: center; gap: 8px; }

  .nav-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 400;
    padding: 6px 14px;
    border-radius: 999px;
    transition: 0.2s;
  }
  .nav-link:hover { color: #fff; background: var(--glow-btn); }
  .nav-link.active { color: #fff; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 22px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: 0.2s;
  }
  .btn:hover {
    background: rgba(255,255,255,0.13);
    border-color: rgba(255,255,255,0.5);
    box-shadow: 0 0 18px rgba(255,255,255,0.12);
  }
  .btn-primary { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.4); }
  .btn-sm { padding: 6px 16px; font-size: 13px; }

  /* Hero */
  .hero {
    position: relative;
    padding: 160px 40px 80px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hero h1 { font-family: 'Orbitron', monospace; font-size: clamp(40px, 7vw, 80px); margin-bottom: 20px; }
  .hero p { color: var(--muted); max-width: 480px; margin-bottom: 36px; }

  /* Grid & Cards */
  .section { padding: 60px 40px; max-width: 1100px; margin: 0 auto; }
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .game-card {
    background: rgba(255,255,255,0.03);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: 0.2s;
    text-decoration: none;
    color: inherit;
    display: block;
    position: relative;
  }
  .game-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.3); }

  .game-thumb {
    width: 100%;
    aspect-ratio: 3/4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    background: linear-gradient(135deg, #1a1a1a, #000);
  }

  .game-info { padding: 12px 14px; }
  .game-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .game-meta { font-size: 12px; color: var(--muted); }

  /* Modal Styles */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal {
    background: #0a0a0a;
    border: 1px solid var(--border);
    padding: 32px;
    border-radius: 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 0 50px rgba(0,0,0,0.5);
  }
  .modal h2 { font-family: 'Orbitron', sans-serif; font-size: 18px; margin-bottom: 20px; }
  .modal input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 12px;
    color: #fff;
    margin-bottom: 12px;
    font-family: 'Outfit', sans-serif;
  }
  .modal select {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 12px;
    color: #fff;
    margin-bottom: 20px;
  }

  /* Status bar */
  .status-bar {
    position: relative;
    margin: 0 40px 60px;
    padding: 20px 28px;
    border-radius: 16px;
    border: 0.5px solid var(--border);
    background: rgba(255,255,255,0.02);
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1020px;
    margin-inline: auto;
  }

  footer { padding: 28px 40px; border-top: 0.5px solid var(--border); display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<nav>
  <a href="#" class="logo">
    <svg class="logo-icon crescent" viewBox="0 0 36 36" fill="none"><path d="M18 3 A15 15 0 1 1 18 33 A11 11 0 1 0 18 3Z" fill="white"/></svg>
    <span style="font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:#fff;">MOONLITE</span>
  </a>
  <div class="nav-links">
    <a href="#" class="nav-link active">Home</a>
    <a href="#library" class="nav-link">Library</a>
    <a href="#status" class="nav-link">My PC</a>
    <a href="#footer" class="nav-link">Settings</a>
  </div>
  <div class="nav-right">
    <button class="btn btn-sm">Sign In</button>
    <button class="btn btn-primary btn-sm">Connect PC</button>
  </div>
</nav>

<section class="hero">
  <h1>MOONLITE</h1>
  <p>Stream your own desktop to any browser. Your rig, wherever you are.</p>
  <div class="hero-btns">
    <button class="btn btn-primary">Start Streaming</button>
    <button class="btn">Connect My PC</button>
  </div>
</section>

<div id="status" class="status-bar">
  <div class="status-item"><span class="status-label">Stream:</span> <span class="status-value">Ready</span></div>
  <div class="status-item"><span class="status-label">Latency:</span> <span class="status-value">— ms</span></div>
  <div class="status-item"><span class="status-label">Protocol:</span> <span class="status-value">WebRTC</span></div>
</div>

<div id="library" class="section">
  <div class="section-header" style="margin-bottom: 24px;">
    <span class="section-title">Your Shortcuts</span>
  </div>
  <div class="games-grid" id="shortcutsGrid">
    <!-- Static Add Button -->
    <a href="javascript:void(0)" class="game-card" onclick="openModal()" style="border-style:dashed; display:flex; align-items:center; justify-content:center; min-height:260px; flex-direction:column; gap:8px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span style="font-size:13px;color:rgba(255,255,255,0.3);">Add Shortcut</span>
    </a>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h2>Add New Shortcut</h2>
    <input type="text" id="shortcutName" placeholder="Name (e.g. Chrome, Discord)">
    <input type="text" id="shortcutPath" placeholder="URL or App Directory">
    <select id="shortcutType">
        <option value="URL">Web URL</option>
        <option value="App">Local PC App</option>
    </select>
    <div style="display:flex; gap:10px;">
        <button class="btn btn-primary" style="flex:1" onclick="addShortcut()">Create</button>
        <button class="btn" style="flex:1" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<footer id="footer">
  <p>© 2026 Moonlite</p>
  <p>Your PC. Your rules.</p>
</footer>

<script>
  function openModal() {
    document.getElementById('modalOverlay').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
  }

  function addShortcut() {
    const name = document.getElementById('shortcutName').value;
    const path = document.getElementById('shortcutPath').value;
    const type = document.getElementById('shortcutType').value;

    if (!name || !path) return alert("Please fill in both fields");

    const grid = document.getElementById('shortcutsGrid');
    const newCard = document.createElement('div');
    newCard.className = 'game-card';
    
    // Gradient based on type
    const bg = type === 'URL' ? 'linear-gradient(135deg,#1a1a2e,#16213e)' : 'linear-gradient(135deg,#2d1515,#0d0d0d)';

    newCard.innerHTML = `
      <div class="game-thumb" style="background: ${bg}; font-size: 20px; color: rgba(255,255,255,0.2)">
        ${type === 'URL' ? '🌐' : '💻'}
      </div>
      <div class="game-info">
        <div class="game-name">${name}</div>
        <div class="game-meta">${type} Shortcut</div>
      </div>
    `;

    // Add it before the "Add" button
    grid.insertBefore(newCard, grid.lastElementChild);
    
    // Clear and close
    document.getElementById('shortcutName').value = '';
    document.getElementById('shortcutPath').value = '';
    closeModal();
  }
</script>

</body>
</html>
